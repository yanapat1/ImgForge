<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Data Center · Explorer (design1)</title>
<link rel="stylesheet" href="../../../static/css/tokens.css">
<script>
  const Q = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = Q.get('theme') === 'light' ? 'light' : 'dark';
</script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--text);
  font: var(--fs)/1.5 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: -.005em; }
.muted { color: var(--text-muted); } .faint { color: var(--text-faint); }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num { font-size: .93em; }
.grow { flex: 1; min-width: 0; }
.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.ico .f, symbol .f { fill: currentColor; fill-opacity: .22; } .ico .s, symbol .s { fill: currentColor; stroke: none; }
.ico.sm { width: 14px; height: 14px; } .ico.xs { width: 12px; height: 12px; }
kbd { font: 500 11px/1 var(--mono); padding: 2px 5px; border-radius: var(--r-sm); background: var(--surface-3); border: 1px solid var(--border-strong); border-bottom-width: 2px; color: var(--text-muted); }

/* controls (mirrors base.css) */
button, select, input { font: inherit; color: var(--text); }
button, .dd { height: var(--control-h); padding: 0 var(--s3); background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: var(--r);
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; font-weight: 550; font-size: var(--fs-sm); cursor: pointer; }
button .ico, .dd .ico { color: var(--text-muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 650; }
button.primary .ico { color: var(--on-accent); }
button.ghost { background: transparent; border-color: transparent; color: var(--text-muted); }
button.icon-btn { width: var(--control-h); padding: 0; justify-content: center; }
button.sm { height: 26px; padding: 0 10px; font-size: var(--fs-xs); }
button.danger-ghost { background: transparent; border-color: transparent; color: var(--danger-text); }
button.danger-ghost .ico { color: var(--danger); }
.dd { padding: 0 8px 0 10px; color: var(--text); font-weight: 500; }
.dd .chev { width: 14px; height: 14px; margin-left: 2px; }
.segmented { display: inline-flex; }
.segmented > button { border-radius: 0; margin-left: -1px; }
.segmented > button:first-child { border-radius: var(--r) 0 0 var(--r); margin-left: 0; }
.segmented > button:last-child { border-radius: 0 var(--r) var(--r) 0; }
.segmented > button.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-text); position: relative; z-index: 1; }
.segmented > button.on .ico { color: var(--accent); }
.cb { width: 16px; height: 16px; flex: none; border: 1.5px solid var(--border-hover); border-radius: var(--r-sm); background: var(--surface); display: inline-grid; place-items: center; }
.cb.on { background: var(--accent) var(--tick) center / 12px no-repeat; border-color: var(--accent); }
.cb.part { background: var(--accent); border-color: var(--accent); }
.cb.part::after { content: ""; width: 8px; height: 2px; border-radius: 1px; background: var(--on-accent); }
.input { height: var(--control-h); display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: var(--r); font-size: var(--fs-sm); color: var(--text-faint); }
.input .ico { color: var(--text-faint); }
.input.val { color: var(--text); }

/* header */
.app-header { flex: none; height: var(--header-h); display: flex; align-items: center; gap: var(--s5); padding: 0 var(--s4) 0 10px; background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font-size: var(--fs-lg); font-weight: 700; letter-spacing: -.01em; }
.brand-mark { width: 32px; height: 32px; color: var(--accent); }
.nav { display: flex; gap: 2px; align-self: stretch; align-items: stretch; margin-left: var(--s2); }
.nav a { display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--text-muted); font-weight: 650; font-size: var(--fs-sm); border-bottom: 2px solid transparent; margin-bottom: -1px; text-decoration: none; }
.nav a .ico { color: var(--text-faint); }
.nav a.on { color: var(--accent-text); border-bottom-color: var(--accent); }
.nav a.on .ico { color: var(--accent); }
.nav .count { font: 600 11px var(--mono); padding: 1px 7px; border-radius: 999px; background: var(--surface-3); color: var(--text-muted); }
.hdr-search { width: 340px; margin-left: auto; }
.hdr-search kbd { margin-left: auto; }
.header-actions { display: flex; align-items: center; gap: var(--s2); }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--av-1); color: var(--on-av); display: grid; place-items: center; font: 700 12px var(--font); }
.gem { color: var(--gem-2); }
.gem-btn { border-color: color-mix(in srgb, var(--gem-2) 45%, var(--border-strong)); }
.gem-btn .ico { color: var(--gem-2); }
.ai-mark { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 22px; height: 22px; border-radius: 6px;
  background: linear-gradient(135deg, var(--gem-1), var(--gem-2) 55%, var(--gem-3)); }
.ai-mark .ico { width: 13px; height: 13px; stroke: var(--on-accent); color: var(--on-accent); }
:root[data-theme="dark"] .ai-mark .ico { stroke: var(--lb-tag-dark); color: var(--lb-tag-dark); }
:root[data-theme="light"] .ai-mark .ico { stroke: var(--lb-tag-light); color: var(--lb-tag-light); }

/* 3-pane layout */
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: 268px minmax(0, 1fr) 344px; grid-template-rows: minmax(0, 1fr) auto; }
.tree { grid-row: 1 / 3; grid-column: 1; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.centre { grid-row: 1; grid-column: 2; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); position: relative; }
.details { grid-row: 1; grid-column: 3; background: var(--surface); border-left: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.drawer { grid-row: 2; grid-column: 2 / 4; background: var(--surface); border-top: 1px solid var(--border-strong); display: flex; flex-direction: column; min-height: 0; }

/* tree */
.tree-head { display: flex; align-items: center; gap: var(--s2); padding: 10px 10px 8px 14px; }
.tree-head h2 { font-size: var(--fs); font-weight: 700; }
.tree-head .grow + button { margin-left: auto; }
.tree-scroll { flex: 1; min-height: 0; overflow: hidden; padding: 0 6px 8px; }
.t-sec { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); padding: 12px 8px 4px; display: flex; align-items: center; gap: 6px; }
.t-sec .num { margin-left: auto; letter-spacing: 0; font-weight: 600; }
.t-row { position: relative; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 calc(6px + var(--d, 0) * 16px); border-radius: var(--r-sm); font-size: var(--fs-sm); color: var(--text); white-space: nowrap; }
.t-row .tw { width: 14px; height: 14px; color: var(--text-faint); flex: none; }
.t-row .tw.none { visibility: hidden; }
.t-row .fi { color: var(--text-faint); width: 15px; height: 15px; }
.t-row .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.t-row .n { margin-left: auto; padding-left: 6px; font: 500 11.5px var(--mono); color: var(--text-faint); font-variant-numeric: tabular-nums; }
.t-row.sel { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.t-row.sel .fi, .t-row.sel .tw { color: var(--accent); }
.t-row.sel .n { color: var(--accent-text); }
.t-row.drop { box-shadow: inset 0 0 0 1px var(--accent-line); }
.t-row .src { width: 13px; height: 13px; color: var(--text-faint); flex: none; }
.fdot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--fc); }
.fdot.other { background: transparent; box-shadow: inset 0 0 0 1.5px var(--fc); }
.t-row .tagdot { width: 7px; height: 7px; border-radius: 2px; background: var(--text-faint); flex: none; margin-left: 2px; }
.tree-foot { border-top: 1px solid var(--border); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.src-line { display: flex; align-items: center; gap: 8px; font-size: var(--fs-xs); color: var(--text-muted); }
.src-line .ico { width: 14px; height: 14px; color: var(--text-faint); }
.src-line .num { margin-left: auto; color: var(--text-faint); }
.meter { height: 4px; border-radius: 999px; background: var(--prog-track); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.tree-foot .btns { display: flex; gap: 6px; } .tree-foot .btns button { flex: 1; justify-content: center; }

/* toolbar */
.toolbar { flex: none; display: flex; align-items: center; gap: var(--s2); padding: 10px var(--s4); background: var(--surface); border-bottom: 1px solid var(--border); }
.crumbs { flex: none; display: flex; align-items: center; gap: 2px; font-size: var(--fs); min-width: 0; margin-right: var(--s2); }
.crumbs span { padding: 2px 5px; border-radius: var(--r-sm); color: var(--text-muted); white-space: nowrap; }
.crumbs span.cur { color: var(--text); font-weight: 650; }
.crumbs .ico { width: 13px; height: 13px; color: var(--text-faint); }
.crumbs .fdot { margin: 0 3px 0 4px; }
.tb-sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }
.strip { flex: none; white-space: nowrap; display: flex; align-items: center; gap: var(--s2); padding: 8px var(--s4); border-bottom: 1px solid var(--border); background: var(--surface); font-size: var(--fs-xs); color: var(--text-muted); min-height: 42px; }
.strip .lbl { color: var(--text-faint); display: inline-flex; align-items: center; gap: 5px; }
.selbar { flex: none; display: flex; align-items: center; gap: 4px; padding: 6px var(--s4) 6px 14px; background: var(--accent-soft); border-bottom: 1px solid var(--accent-line); font-size: var(--fs-sm); }
.selbar b { color: var(--accent-text); margin-right: 8px; }
.selbar button.ghost { color: var(--text); height: 28px; }
.selbar button.ghost .ico { color: var(--accent); }

/* format badge */
.fb { --fc: var(--accent); display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px 0 7px; border-radius: var(--r-sm); font-size: 12px; font-weight: 650;
  background: color-mix(in srgb, var(--fc) 13%, transparent); border: 1px solid color-mix(in srgb, var(--fc) 42%, transparent); color: var(--text); white-space: nowrap; }
.fb .fdot { width: 8px; height: 8px; }
.fb.other { border-style: dashed; background: transparent; }
.fb.lg { height: 28px; font-size: var(--fs-sm); padding: 0 10px 0 9px; }
.fb .conf { font: 600 11px var(--mono); color: var(--text-muted); margin-left: 2px; }

/* tags */
.tag { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 550; color: var(--text-muted); background: var(--surface-2); border: 1px solid var(--border); white-space: nowrap; }
.tag .ico { width: 12px; height: 12px; }
.tag.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-text); }
.tag.auto { background: transparent; border-style: dashed; border-color: var(--border-strong); color: var(--text-faint); font-family: var(--mono); font-size: 11.5px; }
.tag.auto .ico { color: var(--text-faint); }
.tag.add { background: transparent; border-style: dashed; color: var(--text-faint); }
.tag .x { width: 11px; height: 11px; color: var(--text-faint); margin-right: -2px; }

/* bucket cards */
.scroll { flex: 1; min-height: 0; overflow: hidden; padding: var(--s4); }
.sum { display: flex; align-items: baseline; gap: var(--s4); margin-bottom: var(--s3); }
.sum h2 { font-size: var(--fs-xl); font-weight: 700; letter-spacing: -.01em; }
.sum .muted { font-size: var(--fs-sm); }
.fmt-filter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--s4); }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 12px; color: var(--text-muted); }
.fchip .n { font: 500 11px var(--mono); color: var(--text-faint); }
.fchip.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-text); }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); }
.bcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.bcard.sel { border-color: var(--accent-line); box-shadow: 0 0 0 1px var(--accent-line); }
.mosaic { display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; height: 84px; background: var(--media-bg); }
.mosaic img { width: 100%; height: 100%; object-fit: cover; display: block; min-height: 0; }
.mosaic img:first-child { grid-row: 1 / 3; }
.mosaic.ph { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--media-fill); color: var(--text-faint); font-size: 12px; }
.mosaic.ph .ico { width: 22px; height: 22px; }
.bc-body { padding: 10px 12px 10px; display: flex; flex-direction: column; gap: 7px; }
.bc-title { display: flex; align-items: center; gap: 7px; min-width: 0; }
.bc-title b { font-size: var(--fs); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bc-title .src { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-faint); white-space: nowrap; }
.bc-title .src .ico { width: 13px; height: 13px; }
.bc-stats { display: flex; gap: 12px; font-size: 12px; color: var(--text-faint); white-space: nowrap; }
.bc-stats b { font: 600 12px var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }
.bc-tags { display: flex; gap: 4px; flex-wrap: nowrap; overflow: hidden; }
.bc-row { display: flex; align-items: center; gap: 6px; }
.bc-row .warnline { font-size: 11.5px; color: var(--warn-text); display: inline-flex; gap: 4px; align-items: center; margin-left: auto; white-space: nowrap; }
.bc-row .warnline .ico { width: 13px; height: 13px; color: var(--warn); }

/* thumbs grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 10px; }
.th { position: relative; border-radius: var(--r-md); background: var(--surface); outline: 1px solid var(--border); outline-offset: -1px; overflow: hidden; }
.th .im { position: relative; aspect-ratio: 4 / 3; background: var(--media-fill); }
.th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.th .cap { padding: 5px 8px 6px; display: flex; flex-direction: column; gap: 1px; }
.th .cap .fn { font: 500 11.5px var(--mono); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.th .cap .meta { font-size: 11px; color: var(--text-faint); display: flex; gap: 6px; white-space: nowrap; }
.th .cap .meta .miss { color: var(--warn-text); }
.th .ck { position: absolute; left: 6px; top: 6px; width: 20px; height: 20px; border-radius: var(--r-sm); background: var(--overlay); display: none; place-items: center; }
.th .lb { position: absolute; right: 5px; top: 5px; height: 19px; padding: 0 6px; border-radius: var(--r-sm); background: var(--overlay); font: 600 11px/19px var(--mono); color: var(--text); }
.th .lb.miss { background: var(--warn); color: var(--on-highlight); }
.th.sel { outline: 2px solid var(--accent); outline-offset: -2px; box-shadow: 0 0 0 3px var(--accent-soft); }
.th.sel .ck { display: grid; background: var(--accent) var(--tick) center / 13px no-repeat; }
.th.sel .cap { background: var(--accent-soft); }
.th.hl { outline: 2px solid var(--highlight); outline-offset: -2px; box-shadow: 0 0 0 3px var(--highlight-soft); }
.th.hl .ck { display: grid; background: var(--highlight); }
.th.dim { opacity: .45; }

/* list */
.list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
.lrow { display: grid; grid-template-columns: 34px minmax(0, 2.3fr) 84px 96px minmax(0, 1.6fr) 134px; align-items: center; height: 31px; padding: 0 12px 0 10px; border-bottom: 1px solid var(--border); font-size: var(--fs-sm); }
.lrow.head { height: 32px; background: var(--surface-2); font-size: 11.5px; font-weight: 650; color: var(--text-faint); text-transform: uppercase; letter-spacing: .04em; }
.lrow.head .sorted { color: var(--text); display: inline-flex; align-items: center; gap: 3px; }
.lrow .c-n { display: flex; align-items: center; gap: 8px; min-width: 0; }
.lrow .c-n span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12.5px; }
.lrow .c-n .ico { color: var(--text-faint); }
.lrow .c-n .fold { color: var(--accent); }
.lrow .r { text-align: right; padding-right: 16px; font: 12.5px var(--mono); color: var(--text-muted); font-variant-numeric: tabular-nums; }
.lrow .c-l { font-size: 12.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.lrow .c-l .ok { color: var(--ok-text); } .lrow .c-l .ico { width: 13px; height: 13px; }
.lrow .c-l .miss { color: var(--warn-text); }
.lrow .c-m { font: 12px var(--mono); color: var(--text-faint); white-space: nowrap; }
.lrow.sel { background: var(--accent-soft); }
.lrow.sel .c-n span { color: var(--accent-text); }

/* details */
.d-sec { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
.d-sec:last-child { border-bottom: none; }
.d-h { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); display: flex; align-items: center; gap: 6px; }
.d-h .grow + * { margin-left: auto; }
.d-h a { text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 12px; color: var(--accent); }
.d-title { display: flex; align-items: center; gap: 8px; }
.d-title h3 { font-size: var(--fs-lg); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.d-path { font: 12px var(--mono); color: var(--text-faint); display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.d-path .ico { width: 13px; height: 13px; }
.checks { display: grid; grid-template-columns: 16px 1fr auto; gap: 5px 8px; font-size: 12.5px; align-items: center; }
.checks .ico { width: 15px; height: 15px; }
.checks .ok { color: var(--ok); } .checks .bad { color: var(--danger); } .checks .wn { color: var(--warn); }
.checks code { font: 12px var(--mono); color: var(--text); }
.checks .v { font: 11.5px var(--mono); color: var(--text-faint); text-align: right; }
.conf-row { display: flex; align-items: center; gap: 10px; }
.conf-bar { flex: 1; height: 5px; border-radius: 999px; background: var(--prog-track); overflow: hidden; }
.conf-bar i { display: block; height: 100%; background: var(--ok); }
.tags-wrap { display: flex; flex-wrap: wrap; gap: 5px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
.kv div { background: var(--surface-2); padding: 7px 10px; display: flex; flex-direction: column; }
.kv span { font-size: 11px; color: var(--text-faint); }
.kv b { font: 650 14px var(--mono); font-variant-numeric: tabular-nums; }
.split { display: flex; height: 8px; border-radius: 999px; overflow: hidden; gap: 2px; }
.split i { display: block; height: 100%; }
.legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--text-muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; } .legend i { width: 8px; height: 8px; border-radius: 2px; }
.sess { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-2); font-size: 12.5px; }
.sess .k { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 999px; }
.sess .k.viz { background: var(--accent-soft); color: var(--accent-text); }
.sess .k.lab { background: var(--label-badge); color: var(--on-label-badge); }
.sess .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.sess .w { font-size: 11.5px; color: var(--text-faint); white-space: nowrap; }
.send-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.send-row button { justify-content: center; height: 34px; }
.details-foot { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.cls-row { display: grid; grid-template-columns: 9px 1fr 48px 64px; gap: 8px; align-items: center; font-size: 12.5px; }
.cls-row i { width: 9px; height: 9px; border-radius: 50%; }
.cls-row .bar { height: 4px; border-radius: 999px; background: var(--prog-track); overflow: hidden; } .cls-row .bar b { display: block; height: 100%; background: var(--text-faint); }

  const cl = [CLS[i % 4], CLS[(i + 3) % 9]].filter((v, k, a) => a.indexOf(v) === k).slice(0, boxes > 1 ? 2 : 1);
  return { i, name, night, boxes, kb, dims, cl, mod: `Oct 12, ${String(hh).padStart(2, '0')}:${String((mm + 3) % 60).padStart(2, '0')}` };
});

      exp: { 'traffic-cams-2026': TRAFFIC_OPEN('', { noLabels: true }), 'misc-scraps': misc } });
    const rows = [['folder-o', 'images/', '—', '3 folders', '12,480 images', 'Oct 12, 07:10', 1],
      ['file', 'data.yaml', '412 B', '—', 'refs labels/ (missing)', 'Oct 12, 07:02', 0, 1], ['file', 'README.md', '2.1 KB', '—', '—', 'Oct 12, 07:02', 0]];
    ce = folderToolbar('ls', ['traffic-cams-2026']) + `<div class="strip" style="background:var(--danger-soft);border-bottom-color:var(--danger-line);color:var(--text)">${ic('alert')}
      <span><b>Format: Other.</b> YOLO detect needs <code class="mono">images/</code> + <code class="mono">labels/</code> + <code class="mono">data.yaml</code>; <code class="mono">labels/</code> was moved to <b>misc-scraps/labels-traffic</b>.</span><span class="grow"></span><button class="sm">Move it back</button><button class="sm ghost">Set format…</button></div>
      <div class="scroll" style="padding-top:12px"><div class="list"><div class="lrow head"><span class="cb"></span><span class="sorted">Name ${ic('chev-u', 'xs')}</span><span class="r" style="font:inherit">Size</span><span class="r" style="font:inherit">Items</span><span>Contents</span><span>Modified</span></div>
      ${rows.map(r => `<div class="lrow ${r[6] ? 'sel' : ''}"><span class="cb ${r[6] ? 'on' : ''}"></span><span class="c-n">${ic(r[0], r[6] ? 'fold' : '')}<span>${r[1]}</span></span><span class="r">${r[2]}</span><span class="r">${r[3]}</span><span class="c-l">${r[7] ? `${ic('alert', 'miss')}<span class="miss">${r[4]}</span>` : r[4]}</span><span class="c-m">${r[5]}</span></div>`).join('')}</div></div>`;
    de = detailsBucket(true);
    extra = sendModal() + `<div class="toast" style="left:284px;bottom:52px">${ic('alert', 't')}
      <div class="tb"><b>Format changed: YOLO detect → Other (labels/ missing)</b>
      <span>You moved <code class="mono">labels/</code> (12,311 files) to misc-scraps/labels-traffic. Nothing matches a known layout now, so the bucket badge and auto tag switched to <code class="mono">format:other</code>.</span>
      <div class="timer"><i></i></div></div>
      <div class="ta"><button class="sm primary">${ic('undo')}Undo</button><button class="icon-btn ghost sm" style="width:26px">${ic('x')}</button></div></div>`;
  }
  app.innerHTML = `<aside class="tree">${tr}</aside><section class="centre">${ce}</section><aside class="details">${de}</aside>${dr}` + extra;
}

function drawerOpen() {
  const toolRow = (fn, args, res, ms) => `<div class="tool">${ic('check-c', 'okc')}<span class="fnn">${fn}</span><span class="args">(${args})</span><span class="res">→ ${res}</span><span class="ms">${ms}</span>${ic('chev-r', 'chevr')}</div>`;
  return `<div class="drawer open"><div class="dr-grip"><i></i></div>
    <div class="dr-bar"><span class="ai-mark">${ic('gem')}</span><b>Assistant</b><span class="model"><span class="ok-dot"></span>claude-sonnet-4.5 · your key</span>
      <span class="hintline">${ic('lock')}Read-only tools run automatically · anything that changes data waits for Confirm</span><span class="grow"></span>
      <button class="sm ghost">${ic('plus')}New chat</button><button class="icon-btn ghost">${ic('chev-d')}</button></div>
    <div class="dr-body"><div class="dr-main"><div class="log">
      <div class="msg user"><div class="bubble">move all night images into a new folder night/ and tag it</div></div>
      <div class="msg"><span class="ai-mark">${ic('gem')}</span><div class="mbody">
        <div class="tools"><div class="tools-h">${ic('search')}3 read-only tool calls · ran automatically<span class="grow"></span>${ic('chev-d')}</div>
          ${toolRow('search', 'bucket="traffic-cams-2026", path="images/train", query="night", by=["brightness","exif.time"]', '<b>38 matches</b>', '0.4 s')}
          ${toolRow('stat', 'paths=38 results', '41.2 MB, 38/38 have labels', '0.1 s')}
          ${toolRow('list', 'path="images/"', 'train/ val/ test/ (no night/)', '0.0 s')}</div>
        <p>38 night shots in <code>images/train</code> (dark frames or EXIF time 19:00–05:00, highlighted above). Nothing changes until you confirm:</p>
        <div class="plan"><div class="plan-h">${ic('check')}<b>Plan</b><span class="muted">4 actions on traffic-cams-2026</span><span class="pill">${ic('lock', 'xs')}needs your confirmation</span></div>
          <div class="plan-b"><div class="steps">
            <div class="step"><span class="cb on"></span><span class="op">create_folder</span><span class="d"><code>images/night/</code></span><span class="sub">new</span></div>
            <div class="step"><span class="cb on"></span><span class="op">move</span><span class="d">38 images <code>images/train/</code> → <code>images/night/</code></span><span class="sub">41.2 MB</span></div>
            <div class="step"><span class="cb on"></span><span class="op">move</span><span class="d">38 label files <code>labels/train/</code> → <code>labels/night/</code></span><span class="sub">keeps YOLO pairs</span></div>
            <div class="step"><span class="cb on"></span><span class="op">tag</span><span class="d"><code>images/night/</code> with <span class="tag on" style="height:19px">night</span></span><span class="sub"></span></div>
            <div class="step opt"><span class="cb"></span><span class="op">edit_file</span><span class="d">add <code>night: images/night</code> to data.yaml</span><span class="sub">optional</span></div></div>
          <div class="plan-side"><div class="mini">${NIGHT.slice(0, 7).map(i => `<img src="${S(i)}">`).join('')}<span>+31</span></div>
            <div class="after">${ic('check-c')}Format stays ${fb('ydet')}</div></div></div>
          <div class="plan-f"><span class="hint">${ic('undo', 'xs')}One undo step reverts all 4</span><button>Edit plan</button><button>Cancel</button><button class="primary">${ic('check')}Confirm 4 actions</button></div></div>
      </div></div>
      <div class="msg user"><div class="bubble">clean up the dataset</div></div>
      <div class="msg"><span class="ai-mark">${ic('gem')}</span><div class="mbody">
        <p>"Clean up" could mean a few things for <b>traffic-cams-2026</b>. Which one should I prepare a plan for?</p>
        <div class="choices"><span class="choice">Remove exact duplicates <span class="n">14</span></span><span class="choice">Images without labels <span class="n">169</span></span><span class="choice">Corrupt / unreadable files <span class="n">3</span></span><span class="choice">Boxes outside the image <span class="n">27</span></span><span class="choice other">Something else…</span></div>
      </div></div>
      <div class="msg user"><div class="bubble">convert this to a video dataset</div></div>
      <div class="msg"><span class="ai-mark">${ic('gem')}</span><div class="mbody"><div class="cant">
        <div style="font-size:12.5px"><b style="margin-right:4px">${ic('x-c')}I can't do that.</b><span class="muted">This bucket holds stills from 6 cameras taken at irregular intervals (2–40 min apart), so there are no frame sequences to join, and Data Center has no video encoding tool.</span></div>
        <div class="alt">${ic('sparkle')}<span style="font-size:12.5px">Instead I can group images by camera and time into ordered sequence folders (<code>seq/cam03_0712/…</code>) that a Label session steps through like frames.</span><span class="grow"></span><button class="sm">Plan that</button></div>
      </div></div></div>
    </div>
    <div class="composer"><span class="grow">Ask or tell the assistant…</span><span class="faint" style="font-size:11.5px">scope: traffic-cams-2026 / images/train</span><button class="icon-btn primary" style="width:30px">${ic('send')}</button></div></div>
    <div class="dr-side">
      <div class="d-h">Scope</div>
      <div class="scope"><div class="s">${fdot('ydet')}traffic-cams-2026<span class="num">bucket</span></div><div class="s">${ic('folder-o')}images/train<span class="num">8,736</span></div></div>
      <div class="d-h">Tools · run automatically</div>
      <div class="toolcat"><div class="row">${['list', 'search', 'stat', 'read_meta', 'detect_format', 'find_dupes', 'sample'].map(t => `<span class="tchip">${t}</span>`).join('')}</div></div>
      <div class="d-h">Tools · need Confirm</div>
      <div class="toolcat"><div class="row">${['create_folder', 'move', 'copy', 'rename', 'tag', 'edit_file', 'delete', 'send_to_session', 'import'].map(t => `<span class="tchip mut">${t}</span>`).join('')}</div></div>
      <div class="note info">${ic('alert')}<div>The assistant sees file names, folder stats and tags, never pixels, unless you attach images to a message.</div></div>
      <div class="d-h">Pending</div>
      <div class="sess" style="background:var(--accent-soft);border-color:var(--accent-line)"><span class="t">Plan · move 38 night images</span><span class="w">awaiting you</span></div>
    </div></div></div>`;
}

        <div class="o on"><span class="ri"></span><div><b>Label</b><span>Draw, fix and review annotations with your team</span></div>${ic('edit', 'big')}</div></div></div>

      <div class="f2">

        <div><div class="m-lbl">Task type</div><div class="segmented" style="display:flex"><button class="on" style="flex:1;justify-content:center">${ic('box')}Detect</button><button style="flex:1;justify-content:center">${ic('polygon')}Segment</button><button style="flex:1;justify-content:center">${ic('keypoint')}Pose</button><button style="flex:1;justify-content:center">${ic('tag')}Classify</button></div></div></div>

      <div><div class="m-lbl">Selected data <span class="faint" style="font-weight:400">· referenced in place, not copied</span><span class="grow"></span><a style="color:var(--accent);font-size:12px">${ic('plus', 'xs')} Add folders</a><span class="faint" style="padding:0 4px">·</span><a style="color:var(--accent);font-size:12px">${ic('upload', 'xs')} Import new data</a></div>

          <div class="r tot"><span></span><span>2 folders · tags day, cam-north</span><span class="num">11,232 img</span><span class="num">2.9 GB</span><span></span></div></div></div>

    <div class="m-foot"><span class="hint">${ic('lock', 'xs')}Files stay in Data Center; moving them later updates the session</span><button>Cancel</button><button class="primary">${ic('edit')}Create label session</button></div>
  </div></div>`;
}
