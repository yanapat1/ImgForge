<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Center · Command console</title>
<link rel="stylesheet" href="../../../static/css/tokens.css">
<link rel="stylesheet" href="../../../static/css/base.css">
<link rel="stylesheet" href="../../../static/css/layout.css">
<link rel="stylesheet" href="../../../static/css/components.css">
<script>
  const Q = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = Q.get('theme') === 'light' ? 'light' : 'dark';
</script>
<style>
/* ===================================================================== design3: command console */
body { font-size: var(--fs-sm); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.faint { color: var(--text-faint); }
.mutedt { color: var(--text-muted); }

/* ---- header */
.app-header { gap: var(--s4); }
.nav { display: flex; align-self: stretch; gap: 2px; margin-left: var(--s3); }
.nav a { display: flex; align-items: center; gap: 7px; padding: 0 14px; color: var(--text-muted); text-decoration: none; font-weight: 600;
  font-size: var(--fs-sm); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.nav a .ico { color: var(--text-faint); }
.nav a.on { color: var(--text); border-bottom-color: var(--accent); }
.nav a.on .ico { color: var(--accent); }
.nav a .n { font: 600 11px var(--mono); color: var(--text-faint); background: var(--surface-3); padding: 1px 6px; border-radius: 999px; }
.hdr-right { margin-left: auto; display: flex; align-items: center; gap: var(--s2); }
.ai-pill { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface-2); font-size: var(--fs-xs); color: var(--text-muted); }
.ai-pill b { color: var(--text); font-weight: 600; }
.okdot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); flex: none; }
.gem-ico { width: 16px; height: 16px; overflow: visible; }
.gem-ico .gem-body { fill: url(#gem-grad); fill-opacity: .2; stroke: url(#gem-grad); stroke-width: 1.6; stroke-linejoin: round; }
.gem-ico .gem-line { fill: none; stroke: url(#gem-grad); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---- omnibar row */
.omni-row { flex: none; display: flex; align-items: center; gap: var(--s2); padding: 10px var(--s4); background: var(--bg); }
.omni { flex: 1; min-width: 0; height: 38px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 12px;
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-md); }
.omni.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.omni > .ico { color: var(--text-faint); width: 17px; height: 17px; }
.tok { display: inline-flex; align-items: center; height: 24px; border-radius: var(--r-sm); font: 600 12px/1 var(--mono);
  background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent-text); overflow: hidden; flex: none; }
.tok .k { padding: 0 2px 0 7px; color: var(--text-muted); font-weight: 500; }
.tok .v { padding: 0 4px 0 0; }
.tok .x { display: grid; place-items: center; width: 20px; height: 100%; border-left: 1px solid var(--accent-line); }
.tok .x .ico { width: 12px; height: 12px; color: var(--accent-text); }
.tok.scope { background: var(--surface-3); border-color: var(--border-strong); color: var(--text); }
.tok.scope .x { border-left-color: var(--border-strong); }
.tok.scope .x .ico { color: var(--text-muted); }
.tok.ai { background: transparent; border-color: var(--border-strong); color: var(--text); }
.omni .ph { color: var(--text-faint); font-size: var(--fs); white-space: nowrap; }
.omni .typed { color: var(--text); font-size: var(--fs); white-space: nowrap; }
.caret { display: inline-block; width: 1.5px; height: 18px; background: var(--accent); vertical-align: middle; margin-left: 1px; }
.omni .sp { flex: 1; }
.omni .hint-r { font-size: var(--fs-xs); color: var(--text-faint); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.omni-row button { height: 38px; }
.omni-row .count { font-size: var(--fs-xs); color: var(--text-muted); white-space: nowrap; padding: 0 var(--s2); }
.omni-row .count b { font: 600 var(--fs-sm) var(--mono); color: var(--text); }
button .gem-ico { margin-right: -1px; }

/* ---- facet strip */
.facets { flex: none; display: flex; align-items: center; gap: var(--s4); padding: 0 var(--s4) 10px; background: var(--bg); overflow: hidden; }
.fgroup { display: flex; align-items: center; gap: 2px; flex: none; }
.flabel { font: 650 10.5px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); margin-right: 4px; white-space: nowrap; }
.sbar { display: flex; width: 120px; height: 8px; border-radius: 999px; overflow: hidden; gap: 1.5px; background: var(--surface-3); flex: none; margin-right: 4px; }
.sbar i { display: block; height: 100%; background: var(--c); }
.fchip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 7px; border-radius: var(--r-sm); border: 1px solid transparent;
  background: transparent; font-size: 12.5px; color: var(--text); white-space: nowrap; }
.fchip .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--c); flex: none; }
.fchip .n { font: 600 11.5px var(--mono); color: var(--text-muted); }
.fchip.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-text); }
.fchip.on .n { color: var(--accent-text); }
.fchip.more { color: var(--text-muted); border: 1px dashed var(--border-strong); margin-left: 4px; }
.fchip .ico { width: 14px; height: 14px; color: var(--text-faint); }
.legend .fchip { border-color: var(--border); background: var(--surface-2); }
.vsep { width: 1px; height: 20px; background: var(--border); flex: none; }

/* ---- workspace */
.work { flex: 1; min-height: 0; display: flex; border-top: 1px solid var(--border); background: var(--surface); }
.mainp { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.sidep { flex: none; width: 440px; border-left: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }

/* ---- table */
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: var(--fs-sm); }
.tbl th { position: sticky; top: 0; z-index: 1; height: 30px; padding: 0 8px; text-align: left; font: 600 11.5px var(--font); color: var(--text-muted);
  background: var(--surface-2); border-bottom: 1px solid var(--border); white-space: nowrap; letter-spacing: .01em; }
.tbl th.r, .tbl td.r { text-align: right; }
.tbl th .sort { color: var(--accent); margin-left: 3px; }
.tbl th .ico { width: 12px; height: 12px; vertical-align: -1px; }
.tbl td { height: 34px; padding: 0 8px; border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbl td.num, .tbl td.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.tbl td.num { text-align: right; }
.tbl tr.cur td { background: var(--surface-2); }
.tbl tr.cur td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
.tbl tr.sel td { background: var(--accent-soft); }
.tbl tr.sel.cur td { background: var(--accent-soft-hover); }
.tbl tr.dim td > * , .tbl tr.dim td { opacity: .5; }
.tbl tr.dim td:first-child { opacity: 1; }
.tbl tr.grp td { height: 26px; background: var(--bg); font: 650 10.5px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); }
.tbl tr.grp td .mono { text-transform: none; letter-spacing: 0; font-size: 11.5px; color: var(--accent-text); }
.tbl tr.changed td { background: var(--warn-soft); }
.tbl tr.changed td:first-child { box-shadow: inset 2px 0 0 var(--warn); }
.tbl td.cb { width: 34px; padding: 0 0 0 12px; }
.tbl input[type=checkbox] { width: 15px; height: 15px; vertical-align: middle; }
.tbl input[type=checkbox]:checked { background-size: 11px; }
.bname { display: flex; align-items: center; gap: 8px; min-width: 0; }
.bname b { font-weight: 650; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
.bname .ico { color: var(--text-faint); }
.zero { color: var(--text-faint); }

/* format badge */
.fmt { vertical-align: middle; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px 0 7px; border-radius: var(--r-sm); font-size: 12px; font-weight: 600;
  color: var(--text); background: color-mix(in srgb, var(--c) 13%, transparent); border: 1px solid color-mix(in srgb, var(--c) 42%, transparent); }
.fmt::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--c); }
.fmt .sub { color: var(--text-muted); font-weight: 500; }
.fmt.was { text-decoration: line-through; opacity: .7; background: none; border-style: dashed; margin-left: 4px; font-weight: 500; }
.c-yolo { --c: var(--accent); } .c-coco { --c: var(--err-fp); } .c-voc { --c: var(--err-cls); } .c-cls { --c: var(--err-loc); }
.c-img { --c: var(--text-faint); } .c-emb { --c: var(--prog-review); } .c-other { --c: var(--danger); }

/* structure check */
.chk { vertical-align: middle; display: inline-flex; gap: 7px; font: 500 11.5px var(--mono); color: var(--text-muted); }
.chk span { display: inline-flex; align-items: center; gap: 2px; }
.chk .ico { width: 13px; height: 13px; stroke-width: 2.6; }
.chk .ok .ico { color: var(--ok); }
.chk .bad { color: var(--danger-text); }
.chk .bad .ico { color: var(--danger); }
.chk .na { color: var(--text-faint); }

/* tags */
.tags { display: inline-flex; gap: 4px; overflow: hidden; vertical-align: middle; }
.tg { display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 6px; border-radius: 4px; font-size: 11.5px; font-weight: 550;
  color: var(--text); background: var(--surface-3); border: 1px solid transparent; white-space: nowrap; }
.tg.hit { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-text); }
.tg.auto { background: transparent; border: 1px dashed var(--border-strong); color: var(--text-muted); font-family: var(--mono); font-size: 11px; font-weight: 500; }
.tg.auto .ico { width: 10px; height: 10px; color: var(--text-faint); }
.tg .x { width: 11px; height: 11px; color: var(--text-faint); }

.src { vertical-align: middle; max-width: 100%; display: inline-flex; align-items: center; gap: 6px; min-width: 0; color: var(--text-muted); }
.src .ico { color: var(--text-faint); }
.src .p { font: 12px var(--mono); overflow: hidden; text-overflow: ellipsis; }
.sess { vertical-align: middle; display: inline-flex; align-items: center; gap: 5px; font: 600 12.5px var(--mono); }
.sess .ico { width: 14px; height: 14px; color: var(--text-faint); }
.rowact { color: var(--text-faint); }

/* table footer summary */
.tfoot { flex: none; display: flex; align-items: center; gap: var(--s4); height: 32px; padding: 0 var(--s4); border-top: 1px solid var(--border);
  background: var(--surface-2); font-size: var(--fs-xs); color: var(--text-muted); }
.tfoot b { font: 600 12px var(--mono); color: var(--text); }
.scroll { flex: 1; min-height: 0; overflow: hidden; position: relative; }

/* ---- bucket toolbar */
.tbar { flex: none; display: flex; align-items: center; gap: 6px; height: 46px; padding: 0 var(--s4); border-bottom: 1px solid var(--border); background: var(--surface); }
.crumbs { flex: none; display: flex; align-items: center; gap: 4px; font: 600 var(--fs-sm) var(--font); white-space: nowrap; min-width: 0; }
.crumbs a { color: var(--text-muted); text-decoration: none; padding: 3px 5px; border-radius: var(--r-sm); }
.crumbs a.cur { color: var(--text); }
.crumbs .ico { width: 13px; height: 13px; color: var(--text-faint); }
.crumbs .p { font-family: var(--mono); font-weight: 500; }
.tbar > * { flex: none; }
.tbar > .grow { flex: 1; }
.tbar button { height: 28px; padding: 0 9px; font-size: 12.5px; }
.tbar button.icon-btn { width: 28px; padding: 0; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; border-radius: 0; height: 26px; background: var(--surface-2); color: var(--text-muted); }
.seg button + button { border-left: 1px solid var(--border-strong); }
.seg button.on { background: var(--accent-soft); color: var(--accent-text); }
.seg button.on .ico { color: var(--accent); }
.selinfo { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--r); background: var(--accent-soft);
  border: 1px solid var(--accent-line); color: var(--accent-text); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.selinfo .mono { font-size: 12px; }
.tsep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; flex: none; }

/* ---- tree table */
.tt td.nm { overflow: hidden; }
.tnode { display: flex; align-items: center; gap: 6px; min-width: 0; padding-left: calc(var(--d, 0) * 20px); }
.tnode .tw { width: 16px; height: 16px; color: var(--text-faint); flex: none; }
.tnode .tw.sp { visibility: hidden; }
.tnode .fi { color: var(--accent); }
.tnode .fi.file { color: var(--text-faint); }
.tnode .fname { font-family: var(--mono); font-size: 12.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
.tnode .fname.dir { font-family: var(--font); font-weight: 650; font-size: var(--fs-sm); }
.tnode .cnt { font: 11.5px var(--mono); color: var(--text-faint); }
.tt tr.gridrow td { height: auto; padding: 8px 12px 10px calc(12px + 52px); white-space: normal; background: var(--bg); }
.tt tr.gridrow td.cb { padding: 0; }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
.st i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.st.ok { --c: var(--ok); color: var(--text-muted); } .st.warn { --c: var(--warn); color: var(--warn-text); }
.st.bad { --c: var(--danger); color: var(--danger-text); } .st.none { --c: var(--text-faint); color: var(--text-faint); }
.tt tr.night td { background: var(--highlight-soft); }
.tt tr.night td:first-child { box-shadow: inset 2px 0 0 var(--highlight); }
.tt tr.night.sel td { background: color-mix(in srgb, var(--highlight) 22%, transparent); }
.tt tr.virt td { height: 30px; color: var(--text-faint); font-size: var(--fs-xs); background: var(--surface); }

/* ---- thumbnail grid (inside the tree) */
.ghead { display: flex; align-items: center; gap: var(--s3); margin-bottom: 8px; font-size: var(--fs-xs); color: var(--text-muted); }
.ghead b { font: 600 12px var(--mono); color: var(--text); }
.ghead .sz { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.ghead input[type=range] { width: 80px; height: 18px; --fill: 45%; }
.tgrid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
.th { position: relative; aspect-ratio: 4 / 3; border-radius: var(--r-sm); overflow: hidden; background: var(--media-bg);
  outline: 1px solid var(--border); outline-offset: -1px; }
.th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.th .nm { position: absolute; left: 0; right: 0; bottom: 0; padding: 1px 5px; font: 10.5px/1.45 var(--mono); color: var(--text);
  background: var(--overlay); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.th .lc { position: absolute; right: 4px; top: 4px; height: 17px; padding: 0 5px; border-radius: 4px; font: 600 10.5px/17px var(--mono);
  background: var(--overlay); color: var(--text); }
.th .lc.warn { background: var(--warn); color: var(--on-highlight); }
.th input[type=checkbox] { position: absolute; left: 5px; top: 5px; width: 15px; height: 15px; background-color: var(--overlay); opacity: 0; }
.th.sel input[type=checkbox], .th.cur input[type=checkbox] { opacity: 1; }
.th.sel input[type=checkbox] { background: var(--accent) var(--tick) center / 11px no-repeat; border-color: var(--accent); }
.th.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.th.sel::after { content: ""; position: absolute; inset: 0; background: var(--accent-soft); pointer-events: none; }
.th.cur { outline: 2px solid var(--highlight); outline-offset: -2px; box-shadow: 0 0 0 3px var(--highlight-soft); }
.th.more { display: grid; place-items: center; text-align: center; background: var(--surface-2); color: var(--text-muted); font-size: var(--fs-xs);
  outline-style: dashed; outline-color: var(--border-strong); }
.th.more b { display: block; font: 600 var(--fs-sm) var(--mono); color: var(--text); }

/* ---- preview pane */
.pv-head { flex: none; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 8px 0 var(--s4); border-bottom: 1px solid var(--border); }
.pv-head .t { font: 600 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pv-head .pos { font: 11.5px var(--mono); color: var(--text-faint); margin-left: auto; white-space: nowrap; }
.pv-head button { height: 26px; width: 26px; padding: 0; justify-content: center; }
.pv-body { flex: 1; min-height: 0; overflow: hidden; padding: var(--s3) var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
.stage { position: relative; border-radius: var(--r-md); overflow: hidden; background: var(--media-bg); line-height: 0; flex: none; }
.stage img { width: 100%; display: block; }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage rect.b { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; }
.stage rect.tb { opacity: .92; }
.stage text { font: 600 11px var(--font); fill: var(--lb-tag-dark); }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.legend .fchip { height: 22px; font-size: 12px; }
.legend .fchip .dot { border-radius: 50%; }
.meta { display: grid; grid-template-columns: 92px 1fr; gap: 0; font-size: 12.5px; border-top: 1px solid var(--border); }
.meta > * { padding: 5px 0; border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta dt { color: var(--text-muted); }
.meta dd { margin: 0; font-family: var(--mono); font-size: 12px; }
.code { border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; background: var(--bg); flex: none; }
.code .ch { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-bottom: 1px solid var(--border); background: var(--surface-2);
  font: 12px var(--mono); color: var(--text-muted); }
.code .ch .ico { width: 14px; height: 14px; color: var(--text-faint); }
.code .ch .r { margin-left: auto; font-family: var(--font); font-size: 11.5px; color: var(--text-faint); }
.code pre { margin: 0; padding: 6px 0; font: 12px/1.6 var(--mono); color: var(--text); }
.code pre div { padding: 0 10px; display: flex; gap: 12px; }
.code pre div.on { background: var(--highlight-soft); }
.code pre .ln { color: var(--text-faint); width: 14px; text-align: right; flex: none; }
.code pre .cid { font-weight: 700; }
.pv-actions { display: flex; gap: 6px; flex: none; }
.pv-actions button { height: 28px; font-size: 12.5px; }

/* ---- popover (tag editor) */
.pop { position: absolute; z-index: var(--z-popover); width: 340px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-lg);
  box-shadow: var(--shadow-3); font-size: var(--fs-sm); }
.pop::before { content: ""; position: absolute; top: -6px; left: 50px; width: 10px; height: 10px; transform: rotate(45deg); background: var(--surface);
  border-left: 1px solid var(--border-strong); border-top: 1px solid var(--border-strong); }
.pop-h { display: flex; align-items: center; gap: 6px; padding: 10px 12px 8px; font-weight: 650; }
.pop-h .p { font: 500 12px var(--mono); color: var(--text-muted); }
.pop-sec { padding: 4px 12px 10px; }
.pop-sec .lbl { font: 650 10.5px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 6px; display: flex; gap: 6px; }
.pop-sec .lbl span { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 11px; }
.pop .tgwrap { display: flex; flex-wrap: wrap; gap: 5px; }
.pop .tg { height: 24px; font-size: 12px; padding: 0 7px; }
.pop .tg.auto { font-size: 11.5px; }
.tin { display: flex; align-items: center; gap: 6px; height: 32px; margin: 0 12px; padding: 0 10px; border: 1px solid var(--accent); border-radius: var(--r);
  box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface-2); }
.tin .ico { color: var(--text-faint); width: 14px; height: 14px; }
.sugg { list-style: none; margin: 6px 0 0; padding: 4px; border-top: 1px solid var(--border); }
.sugg li { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: var(--r-sm); }
.sugg li.on { background: var(--accent-soft); }
.sugg li b { font-weight: 600; } .sugg li b u { text-decoration: none; color: var(--accent-text); }
.sugg li .r { margin-left: auto; font-size: 11.5px; color: var(--text-faint); }
.sugg li .ico { width: 14px; height: 14px; color: var(--text-faint); }
.pop-f { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--text-faint);
  background: var(--surface-2); border-radius: 0 0 var(--r-lg) var(--r-lg); }
.pop-f kbd { font-size: 10.5px; padding: 1px 4px; }
.pop-note { display: flex; gap: 8px; padding: 0 12px 10px; font-size: 11.5px; line-height: 1.45; color: var(--text-muted); }

  font-size: 12px; font-weight: 550; color: var(--text); white-space: nowrap; }

function toast() {
  return `<div class="toast">${ic('alert')}<div class="tx"><b>Format changed: YOLO detect → Other</b> <span class="mutedt">(labels/ missing)</span><span class="mutedt" style="float:none"></span>

}
